<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1" />
  <title>Motion Fitness</title>
  <link rel="stylesheet" href="style.css" />
    <!-- 手机支持：PWA（添加到主屏后无浏览器栏，是 iOS 上最接近真全屏的正规做法）+ 伪全屏兜底 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="体感健身">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b1017">
    <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg></span>
        <div class="brand-text">
          <h1><span data-i18n="app.brand"></span> <span class="ver">v3.0</span></h1>
          <p data-i18n="app.subtitle"></p>
        </div>
      </div>
      <div class="topbar-actions">
        <!-- 返回主页：和奖杯 / 齿轮那几个一样是图标按钮，文字含义放在 title / aria-label 里（快捷键 H）。
             图标统一用**线条图标**（Lucide ISC，24×24 / stroke 2 / currentColor），不再用 emoji。 -->
        <button class="icon-btn" id="btnHome" type="button" hidden
                data-i18n-title="home.back" data-i18n-aria="home.back">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
        <!-- 运动设定：只出现在动作页，管「这个动作」的目标与判据 -->
        <button class="icon-btn" id="btnExercise" type="button" hidden
                data-i18n-title="exercise.open" data-i18n-aria="exercise.open">
          <span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
        </button>
        <!-- 最佳成绩 / 运动记录：内容都放在弹窗里，不再占动作页的地方（用户要求） -->
        <button class="icon-btn" id="btnBest" type="button"
                data-i18n-title="home.openBest" data-i18n-aria="home.openBest">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        </button>
        <button class="icon-btn" id="btnHistory" type="button"
                data-i18n-title="home.openHistory" data-i18n-aria="home.openHistory">
          <span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></span>
        </button>
        <button class="icon-btn" id="btnSettings" type="button"
                data-i18n-title="home.openSettings" data-i18n-aria="home.openSettings">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </header>

    <!-- ================= 主页：分类 + 动作图标网格 ================= -->
    <main class="home" id="homeView">
      <div class="home-head">
        <div>
          <h2 class="home-title" data-i18n="home.title"></h2>
          <p class="home-sub" data-i18n="home.subtitle"></p>
        </div>
        <label class="search-field">
          <span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
          <input id="exSearch" type="search" data-i18n-placeholder="home.search" autocomplete="off" />
        </label>
      </div>

      <!-- 全手势操作的入口（用户要求）：点一下 → 打开摄像头 → 全屏视频界面 → 用手势选动作。
           下面的动作库照旧保留：鼠标用户可以直接点开某个动作（两条路都通）。 -->
      <button class="start-gesture" id="btnStartGesture" type="button">
        <span class="start-gesture-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></span>
        <span class="start-gesture-main">
          <span class="start-gesture-title" data-i18n="menu.start"></span>
          <span class="start-gesture-sub" data-i18n="menu.startSub"></span>
        </span>
        <svg class="ui-icon start-gesture-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
      </button>

      <div id="homeCats"></div>
    </main>

    <!-- ================= 动作页：摄像头 + 面板 ================= -->
    <main class="layout" id="workoutView" hidden>
      <section class="stage-card">
        <div class="stage" id="stage">
          <video id="video" playsinline muted autoplay></video>
          <canvas id="overlay"></canvas>

          <div class="stage-mask" id="stageMask">
            <div class="mask-inner">
              <div class="mask-icon" id="maskIcon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg></div>
              <h2 id="maskTitle" data-i18n="ui.maskTitle"></h2>
              <p id="maskText" data-i18n="ui.maskText"></p>
              <button class="primary-btn" id="btnStartCam" type="button" data-i18n="ui.startCam"></button>
              <p class="mask-hint" data-i18n="ui.maskHint"></p>
              <!-- 摄像头诊断面板（手机 / PC 通用，可折叠）：
                   打不开摄像头时列出浏览器此刻的客观事实（isSecureContext / 协议 / mediaDevices /
                   getUserMedia 报错 / 画面尺寸 / video 属性）+ 一句对应的中文处置建议。
                   内容由 app.js 的 renderCameraDiag() 填，PC 上同样是这块小面板，不占地方。 -->
              <details class="cam-diag" id="camDiag" hidden>
                <summary data-i18n="diag.title"></summary>
                <p class="cam-diag-lead" data-i18n="diag.lead"></p>
                <ul class="cam-diag-list" id="camDiagList"></ul>
                <p class="cam-diag-advice" id="camDiagAdvice"></p>
              </details>
            </div>
          </div>

          <div class="hud" id="hud" hidden>
            <div class="hud-left">
              <div class="hud-badge"><span id="hudIcon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg></span><span id="hudName"></span></div>
              <div class="hud-value-row">
                <span class="hud-value" id="hudValue">0</span>
                <span class="hud-unit" id="hudUnit"></span>
              </div>
              <!-- 分数：紧贴次数下方（用户要求「分数要放在和次数靠近的地方」，并且用另一种颜色） -->
              <div class="hud-score" id="hudScore">0</div>
              <div class="hud-sub" id="hudSub"></div>
              <div class="hud-extra" id="hudExtra"></div>
            </div>
            <div class="hud-ring">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
                <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
              </svg>
              <div class="ring-text" id="ringText">0%</div>
            </div>
          </div>

          <div class="score-pop" id="scorePop"></div>

          <!-- 判定进度条：每识别到一个关键帧姿态就点亮一格线条图标（不写文字，鼠标移上去看判据） -->
          <div class="criteria-bar" id="criteriaBar" hidden>
            <div class="criteria-tip" id="criteriaTip" hidden></div>
            <div class="criteria-head">
              <span class="criteria-earned" id="criteriaEarned"></span>
            </div>
            <div class="criteria-track" id="criteriaTrack"></div>
          </div>

          <div class="pose-hint" id="poseHint" hidden></div>
          <div class="calib-prompt" id="calibPrompt" hidden>
            <div class="calib-prompt-main" id="calibPromptMain"></div>
            <div class="calib-prompt-sub" id="calibPromptSub"></div>
          </div>

          <!-- 记录调试数据时的角标（用户要求）：贴在画面**右下角**，显示「正在记录」+ 已记帧数。
               默认藏着；打开「记录调试数据」开关时出现，关掉就消失。 -->
          <div class="rec-badge" id="recBadge" hidden
               data-i18n-title="ui.recTitle" data-i18n-aria="ui.recTitle">
            <span class="rec-dot" aria-hidden="true"></span>
            <span class="rec-num" id="recFrames">0</span>
            <span class="rec-unit" data-i18n="ui.recUnit"></span>
          </div>

          <!-- 全屏按钮贴在视频框右下角：点它放大的是「视频框」本身，而不是整个 HTML 页面 -->
          <button class="stage-btn" id="btnFullscreen" type="button" aria-pressed="false"
                  data-i18n-title="ui.fullscreen" data-i18n-aria="ui.fullscreen">
            <span class="stage-btn-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></span>
          </button>
          <!-- 一组结束后的两个手势圆环：把手掌放到圆环中央保持 3 秒就触发（鼠标点也行） -->
          <div class="gesture-rings" id="gestureRings" hidden>
            <button class="ring-btn" id="ringExit" type="button">
              <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-fill" cx="60" cy="60" r="52"></circle>
              </svg>
              <span class="ring-label" id="ringExitLabel"></span>
              <span class="ring-timer" id="ringExitTimer"></span>
            </button>
            <button class="ring-btn" id="ringRetry" type="button">
              <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-fill" cx="60" cy="60" r="52"></circle>
              </svg>
              <span class="ring-label" id="ringRetryLabel"></span>
              <span class="ring-timer" id="ringRetryTimer"></span>
            </button>
          </div>
          <div class="gesture-hint" id="gestureHint" hidden></div>

          <!-- 手势选择菜单（用户要求）：全屏视频界面上用手掌停 3 秒选动作。
               **两级菜单 + 分页**（用户要求「每行放 4 个、一页不够就加页、向上/向下挥手翻页」）：
               第一级 5 个分类 → 第二级是该分类的动作 +「返回」；一页只放一行 4 个，圆环因此做得很大。
               菜单项由 app.js 按动作库动态生成，位置 / 直径 / 字号都在那边按舞台尺寸算好写进行内样式。 -->
          <div class="gesture-menu" id="gestureMenu" hidden>
            <!-- 「整屏」：翻页 / 返回时这一块整体滑动（标题 + 圆环 + 底部提示一起走） -->
            <div class="menu-screen" id="menuScreen">
            <div class="menu-head" id="menuHead">
              <div class="menu-title" id="menuTitle" data-i18n="menu.title"></div>
              <div class="menu-lead" id="menuLead" data-i18n="menu.lead"></div>
              <!-- 页码（只有一页时隐藏；点一下 = 下一页，鼠标用户的翻页办法） -->
              <button class="menu-page" id="menuPage" type="button" hidden></button>
            </div>
            <div class="menu-grid" id="menuGrid"></div>
            <!-- 手掌指针（猫爪）：出现在手掌当前的位置，让用户知道自己的手在哪儿（不跟着换屏滑动） -->
            <div class="paw-layer" id="pawLayer" aria-hidden="true">
              <span class="paw" id="pawL"></span>
              <span class="paw" id="pawR"></span>
            </div>
            <!-- 换屏动画用的「残影」层：翻页 / 返回时把上一屏的圆环克隆到这里滑出去，
                 真实的那一屏立刻重建（状态与 DOM 始终同步），见 app.js 的 animateMenuSwap -->
            <div class="menu-ghost" id="menuGridGhost"></div>
            <!-- 底部提示随层级换（第一级的「↩ 返回」= 回网页首页、第二级 = 回分类），文案见 renderMenu -->
            <div class="menu-foot" id="menuFoot" data-i18n="menu.hint"></div>
            </div>
          </div>

          <!-- 左下角常驻的「退出」圆环：手或脚伸进圆环停 3 秒 → 退出这一组并退出全屏。
               动画与「一组结束后」的两个圆环完全一样（同一套 ring-* 样式与进度逻辑）。
               在手势菜单里它是「回到网页首页」，在动作里是「回到手势菜单」。 -->
          <div class="corner-ring" id="cornerExit" hidden>
            <button class="ring-btn" id="ringQuickExit" type="button"
                    data-i18n-title="ui.gestureExit" data-i18n-aria="ui.gestureExit">
              <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-fill" cx="60" cy="60" r="52"></circle>
              </svg>
              <span class="ring-label" id="ringQuickExitLabel"></span>
              <span class="ring-timer" id="ringQuickExitTimer"></span>
            </button>
          </div>

          <div class="countdown" id="countdown" hidden><span id="countdownNum">3</span></div>
          <div class="celebrate" id="celebrate" hidden><div class="celebrate-inner"><span id="celebrateText"></span></div></div>
        </div>

        <div class="stage-toolbar">
          <div class="cam-status">
            <span class="dot" id="camDot"></span>
            <span id="camStatus"></span>
          </div>
          <label class="field">
            <span data-i18n="ui.lens"></span>
            <select id="camSel"></select>
          </label>
          <div class="spacer"></div>
          <button class="ghost-btn" id="btnRecalibrate" type="button" data-i18n="calib.recalibrate"></button>
          <button class="ghost-btn" id="btnResetReps" type="button" data-i18n="ui.resetReps"></button>
        </div>
        <div class="debug-line" id="debugLine" hidden></div>
      </section>

      <aside class="panel">
        <section class="card">
          <h2 class="card-title" id="howtoTitle"></h2>
          <p class="camera-hint" id="cameraHint"></p>
          <p class="judge-line" id="judgeLine"></p>
          <ul class="howto-list" id="howtoList"></ul>
          <ul class="tip-list" id="tipList"></ul>
        </section>

        <section class="card steps-card">
          <div class="card-title-row">
            <h2 class="card-title" data-i18n="ui.scoreCard"></h2>
            <span class="score-badge" id="scoreBadge">0</span>
          </div>
          <ul class="step-list" id="stepList"></ul>
          <p class="step-hint" id="stepHint"></p>
          <p class="step-note" data-i18n="ui.stepsNote"></p>
        </section>

        <section class="card calib-card" id="calibCard">
          <div class="card-title-row">
            <h2 class="card-title" data-i18n="calib.title"></h2>
            <span class="calib-badge" id="calibBadge">0/0</span>
          </div>
          <p class="calib-lead" data-i18n="calib.lead"></p>
          <ul class="calib-list" id="calibList"></ul>
          <div class="calib-bar"><div class="calib-fill" id="calibFill"></div></div>
          <p class="calib-hint" id="calibHint"></p>
        </section>

        <section class="card">
          <div class="card-title-row">
            <h2 class="card-title" data-i18n="ui.step2"></h2>
            <button class="mini-btn" id="btnExerciseInline" type="button" data-i18n="exercise.open"></button>
          </div>
          <p class="target-readout" id="targetReadout"></p>
        </section>

        <section class="card">
          <h2 class="card-title" data-i18n="ui.step3"></h2>
          <div class="btn-row">
            <button class="primary-btn" id="btnStart" type="button" data-i18n="ui.start"></button>
            <button class="ghost-btn" id="btnPause" type="button" disabled data-i18n="ui.pause"></button>
            <button class="ghost-btn" id="btnStop" type="button" disabled data-i18n="ui.stop"></button>
          </div>
          <div class="live-stats">
            <div class="stat">
              <span class="stat-label" data-i18n="ui.totalScore"></span>
              <span class="stat-value" id="statScore">0</span>
            </div>
            <div class="stat">
              <span class="stat-label" data-i18n="ui.validReps"></span>
              <span class="stat-value" id="statValid">0</span>
            </div>
            <div class="stat">
              <span class="stat-label" data-i18n="ui.partial"></span>
              <span class="stat-value warn" id="statPartial">0</span>
            </div>
            <div class="stat">
              <span class="stat-label" id="statTimerLabel" data-i18n="ui.setTime"></span>
              <span class="stat-value" id="statTimer">00:00</span>
            </div>
            <div class="stat">
              <span class="stat-label" data-i18n="ui.depth"></span>
              <span class="stat-value" id="statDepth">0%</span>
            </div>
          </div>
          <div class="depth-bar"><div class="depth-fill" id="depthFill"></div></div>
          <p class="cue-line" id="cueLine"></p>
        </section>

        <section class="card summary" id="summaryCard" hidden>
          <h2 class="card-title" data-i18n="ui.summaryTitle"></h2>
          <div class="summary-grid" id="summaryGrid"></div>
          <p class="summary-note" id="summaryNote"></p>
        </section>

        <section class="card muted">
          <h2 class="card-title" data-i18n="ui.shortcuts"></h2>
          <p class="keys" data-i18n-html="ui.shortcutsText"></p>
        </section>
      </aside>
    </main>
  </div>

  <!-- ================= 设置弹窗 ================= -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-backdrop" id="settingsBackdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle" data-i18n="settings.title"></h2>
        <button class="icon-btn" id="btnCloseSettings" type="button"
                data-i18n-title="settings.close" data-i18n-aria="settings.close">
          <span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
        </button>
      </div>

      <div class="modal-body">
        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="settings.language"></h3>

  <script type="module" src="src/app.js"></script>
  <script>
    /*
     * iPhone 全屏兜底（用户反馈「Safari 和 Chrome 都无法进入全屏模式」）：
     * iOS Safari 没有元素级 Fullscreen API（只有 iPad 有），全屏按钮点了没反应。
     * 这里只在**没有原生全屏能力**时接管：切 #stage 的 CSS 伪全屏（页面其余部分被盖住，
     * HUD / 判定进度条 / 圆环都保留）。有原生能力的浏览器完全不进这段逻辑，行为不变。
     */
    (function () {
      var canNative = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled
        || document.documentElement.webkitRequestFullscreen);
      if (canNative) return;
      function stageEl() { return document.getElementById('stage'); }
      function isOn() { var s = stageEl(); return !!(s && s.classList.contains('pseudo-fullscreen')); }
      function paint(on) {
        var s = stageEl();
        if (s) s.classList.toggle('pseudo-fullscreen', on);
        document.body.classList.toggle('pseudo-fullscreen', on);
      }
      var btn = document.getElementById('btnFullscreen');
      if (btn) btn.addEventListener('click', function () { paint(!isOn()); });
      window.addEventListener('orientationchange', function () { if (isOn()) paint(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && isOn()) paint(false); });
    })();
  </script>
