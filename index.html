<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motion Fitness</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">🏃</span>
        <div class="brand-text">
          <h1><span data-i18n="app.brand"></span> <span class="ver">v3.0</span></h1>
          <p data-i18n="app.subtitle"></p>
        </div>
      </div>
      <div class="topbar-actions">
        <!-- 返回主页：与 🎯 / ⚙️ 一样是图标按钮，文字含义放在 title / aria-label 里（快捷键 H） -->
        <button class="icon-btn" id="btnHome" type="button" hidden
                data-i18n-title="home.back" data-i18n-aria="home.back">
          <span aria-hidden="true">🏠</span>
        </button>
        <!-- 运动设定：只出现在动作页，管「这个动作」的目标与判据 -->
        <button class="icon-btn" id="btnExercise" type="button" hidden
                data-i18n-title="exercise.open" data-i18n-aria="exercise.open">
          <span aria-hidden="true">🎯</span>
        </button>
        <button class="icon-btn" id="btnSettings" type="button"
                data-i18n-title="home.openSettings" data-i18n-aria="home.openSettings">
          <span aria-hidden="true">⚙️</span>
        </button>
      </div>
    </header>

    <!-- ================= 主页：分类 + 动作图标网格 ================= -->
    <main class="home" id="homeView">
      <div class="home-head">
        <div>
          <h2 class="home-title" data-i18n="home.title"></h2>
          <p class="home-sub" data-i18n="home.subtitle"></p>
        </div>
        <label class="search-field">
          <span aria-hidden="true">🔍</span>
          <input id="exSearch" type="search" data-i18n-placeholder="home.search" autocomplete="off" />
        </label>
      </div>
      <div id="homeCats"></div>
    </main>

    <!-- ================= 动作页：摄像头 + 面板 ================= -->
    <main class="layout" id="workoutView" hidden>
      <section class="stage-card">
        <div class="stage" id="stage">
          <video id="video" playsinline muted autoplay></video>
          <canvas id="overlay"></canvas>

          <div class="stage-mask" id="stageMask">
            <div class="mask-inner">
              <div class="mask-icon" id="maskIcon">📷</div>
              <h2 id="maskTitle" data-i18n="ui.maskTitle"></h2>
              <p id="maskText" data-i18n="ui.maskText"></p>
              <button class="primary-btn" id="btnStartCam" type="button" data-i18n="ui.startCam"></button>
              <p class="mask-hint" data-i18n="ui.maskHint"></p>
            </div>
          </div>

          <div class="hud" id="hud" hidden>
            <div class="hud-left">
              <div class="hud-badge"><span id="hudIcon">🏋️</span><span id="hudName"></span></div>
              <div class="hud-value-row">
                <span class="hud-value" id="hudValue">0</span>
                <span class="hud-unit" id="hudUnit"></span>
              </div>
              <!-- 分数：紧贴次数下方（用户要求「分数要放在和次数靠近的地方」，并且用另一种颜色） -->
              <div class="hud-score" id="hudScore">0</div>
              <div class="hud-sub" id="hudSub"></div>
              <div class="hud-extra" id="hudExtra"></div>
            </div>
            <div class="hud-ring">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
                <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
              </svg>
              <div class="ring-text" id="ringText">0%</div>
            </div>
          </div>

          <div class="score-pop" id="scorePop"></div>

          <!-- 判定进度条：每识别到一个关键帧姿态就点亮一格线条图标（不写文字，鼠标移上去看判据） -->
          <div class="criteria-bar" id="criteriaBar" hidden>
            <div class="criteria-tip" id="criteriaTip" hidden></div>
            <div class="criteria-head">
              <span class="criteria-earned" id="criteriaEarned"></span>
            </div>
            <div class="criteria-track" id="criteriaTrack"></div>
          </div>

          <div class="pose-hint" id="poseHint" hidden></div>
          <div class="calib-prompt" id="calibPrompt" hidden>
            <div class="calib-prompt-main" id="calibPromptMain"></div>
            <div class="calib-prompt-sub" id="calibPromptSub"></div>
          </div>

          <!-- 全屏按钮贴在视频框右下角：点它放大的是「视频框」本身，而不是整个 HTML 页面 -->
          <button class="stage-btn" id="btnFullscreen" type="button" aria-pressed="false"
                  data-i18n-title="ui.fullscreen" data-i18n-aria="ui.fullscreen">
            <span class="stage-btn-icon" aria-hidden="true">⛶</span>
          </button>
          <!-- 一组结束后的两个手势圆环：把手掌放到圆环中央保持 3 秒就触发（鼠标点也行） -->
          <div class="gesture-rings" id="gestureRings" hidden>
            <button class="ring-btn" id="ringExit" type="button">
              <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-fill" cx="60" cy="60" r="52"></circle>
              </svg>
              <span class="ring-label" id="ringExitLabel"></span>
              <span class="ring-timer" id="ringExitTimer"></span>
            </button>
            <button class="ring-btn" id="ringRetry" type="button">
              <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="ring-fill" cx="60" cy="60" r="52"></circle>
              </svg>
              <span class="ring-label" id="ringRetryLabel"></span>
              <span class="ring-timer" id="ringRetryTimer"></span>
            </button>
          </div>
          <div class="gesture-hint" id="gestureHint" hidden></div>

          <div class="countdown" id="countdown" hidden><span id="countdownNum">3</span></div>
          <div class="celebrate" id="celebrate" hidden><div class="celebrate-inner"><span id="celebrateText"></span></div></div>
        </div>

        <div class="stage-toolbar">
          <div class="cam-status">
            <span class="dot" id="camDot"></span>
            <span id="camStatus"></span>
          </div>
          <label class="field">
            <span data-i18n="ui.lens"></span>
            <select id="camSel"></select>
          </label>
          <div class="spacer"></div>
          <button class="ghost-btn" id="btnRecalibrate" type="button" data-i18n="calib.recalibrate"></button>
          <button class="ghost-btn" id="btnResetReps" type="button" data-i18n="ui.resetReps"></button>
        </div>
        <div class="debug-line" id="debugLine" hidden></div>
      </section>

      <aside class="panel">
        <section class="card">
          <h2 class="card-title" id="howtoTitle"></h2>
          <p class="camera-hint" id="cameraHint"></p>
          <p class="judge-line" id="judgeLine"></p>
          <ul class="howto-list" id="howtoList"></ul>
          <ul class="tip-list" id="tipList"></ul>
        </section>

        <section class="card steps-card">
          <div class="card-title-row">
            <h2 class="card-title" data-i18n="ui.scoreCard"></h2>
            <span class="score-badge" id="scoreBadge">0</span>
          </div>
          <ul class="step-list" id="stepList"></ul>
          <p class="step-hint" id="stepHint"></p>
          <p class="step-note" data-i18n="ui.stepsNote"></p>
        </section>

        <section class="card calib-card" id="calibCard">
          <div class="card-title-row">
            <h2 class="card-title" data-i18n="calib.title"></h2>
            <span class="calib-badge" id="calibBadge">0/0</span>
          </div>
          <p class="calib-lead" data-i18n="calib.lead"></p>
          <ul class="calib-list" id="calibList"></ul>
          <div class="calib-bar"><div class="calib-fill" id="calibFill"></div></div>
          <p class="calib-hint" id="calibHint"></p>
        </section>

        <section class="card">
          <div class="card-title-row">
            <h2 class="card-title" data-i18n="ui.step2"></h2>
            <button class="mini-btn" id="btnExerciseInline" type="button" data-i18n="exercise.open"></button>
          </div>
          <p class="target-readout" id="targetReadout"></p>
        </section>

        <section class="card">
          <h2 class="card-title" data-i18n="ui.step3"></h2>
          <div class="btn-row">
            <button class="primary-btn" id="btnStart" type="button" data-i18n="ui.start"></button>
            <button class="ghost-btn" id="btnPause" type="button" disabled data-i18n="ui.pause"></button>
            <button class="ghost-btn" id="btnStop" type="button" disabled data-i18n="ui.stop"></button>
          </div>
          <div class="live-stats">
            <div class="stat">
              <span class="stat-label" data-i18n="ui.totalScore"></span>
              <span class="stat-value" id="statScore">0</span>
            </div>
            <div class="stat">
              <span class="stat-label" data-i18n="ui.validReps"></span>
              <span class="stat-value" id="statValid">0</span>
            </div>
            <div class="stat">
              <span class="stat-label" data-i18n="ui.partial"></span>
              <span class="stat-value warn" id="statPartial">0</span>
            </div>
            <div class="stat">
              <span class="stat-label" id="statTimerLabel" data-i18n="ui.setTime"></span>
              <span class="stat-value" id="statTimer">00:00</span>
            </div>
            <div class="stat">
              <span class="stat-label" data-i18n="ui.depth"></span>
              <span class="stat-value" id="statDepth">0%</span>
            </div>
          </div>
          <div class="depth-bar"><div class="depth-fill" id="depthFill"></div></div>
          <p class="cue-line" id="cueLine"></p>
        </section>

        <section class="card summary" id="summaryCard" hidden>
          <h2 class="card-title" data-i18n="ui.summaryTitle"></h2>
          <div class="summary-grid" id="summaryGrid"></div>
          <p class="summary-note" id="summaryNote"></p>
        </section>

        <section class="card">
          <h2 class="card-title" data-i18n="ui.best"></h2>
          <ul class="record-list" id="recordList"></ul>
        </section>

        <section class="card">
          <div class="card-title-row">
            <h2 class="card-title" data-i18n="ui.history"></h2>
            <button class="mini-btn" id="btnClearHistory" type="button" data-i18n="ui.clear"></button>
          </div>
          <ul class="history-list" id="historyList"></ul>
        </section>

        <section class="card muted">
          <h2 class="card-title" data-i18n="ui.shortcuts"></h2>
          <p class="keys" data-i18n-html="ui.shortcutsText"></p>
        </section>
      </aside>
    </main>
  </div>

  <!-- ================= 设置弹窗 ================= -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-backdrop" id="settingsBackdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle" data-i18n="settings.title"></h2>
        <button class="icon-btn" id="btnCloseSettings" type="button"
                data-i18n-title="settings.close" data-i18n-aria="settings.close">
          <span aria-hidden="true">✕</span>
        </button>
      </div>

      <div class="modal-body">
        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="settings.language"></h3>
          <label class="field wide">
            <span data-i18n="ui.language"></span>
            <select id="langSel" aria-label="Language"></select>
          </label>
        </div>

        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="settings.model"></h3>
          <label class="field wide">
            <span data-i18n="ui.model"></span>
            <select id="modelSel">
              <option value="lite" data-i18n="ui.modelLite"></option>
              <option value="full" data-i18n="ui.modelFull"></option>
            </select>
          </label>
          <p class="modal-hint" data-i18n="settings.modelHint"></p>
        </div>

        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="settings.sound"></h3>
          <div class="toggle-grid">
            <button class="toggle" id="btnVoice" type="button" aria-pressed="true" data-i18n="ui.voice"></button>
            <button class="toggle" id="btnSfx" type="button" aria-pressed="true" data-i18n="ui.sfx"></button>
            <button class="toggle" id="btnMusic" type="button" aria-pressed="true" data-i18n="ui.music"></button>
          </div>
          <h3 class="modal-group-title modal-group-title--sub" data-i18n="settings.musicTrack"></h3>
          <div class="track-list" id="musicTracks"></div>
        </div>

        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="settings.cameraGroup"></h3>
          <div class="toggle-grid">
            <button class="toggle" id="btnMirror" type="button" aria-pressed="true" data-i18n="ui.mirror"></button>
            <button class="toggle" id="btnSkeleton" type="button" aria-pressed="true" data-i18n="ui.skeleton"></button>
            <button class="toggle" id="btnAngles" type="button" aria-pressed="true" data-i18n="ui.angles"></button>
            <button class="toggle" id="btnDebug" type="button" aria-pressed="false" data-i18n="ui.debug"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 运动设定弹窗（只对当前动作生效） ================= -->
  <div class="modal" id="exerciseModal" hidden>
    <div class="modal-backdrop" id="exerciseBackdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exerciseTitle">
      <div class="modal-head">
        <h2 id="exerciseTitle" data-i18n="exercise.title"></h2>
        <button class="icon-btn" id="btnCloseExercise" type="button"
                data-i18n-title="exercise.close" data-i18n-aria="exercise.close">
          <span aria-hidden="true">✕</span>
        </button>
      </div>

      <div class="modal-body">
        <p class="exercise-head" id="exerciseName"></p>
        <p class="modal-hint" data-i18n="exercise.lead"></p>

        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="exercise.targetGroup"></h3>
          <div class="target-row">
            <button class="step-btn" id="tMinus" type="button">−</button>
            <input id="targetInput" type="number" min="1" max="999" step="1" value="15"
                   data-i18n-aria="exercise.target" />
            <button class="step-btn" id="tPlus" type="button">＋</button>
            <span class="target-unit" id="targetUnit"></span>
          </div>
          <div class="chips" id="targetChips"></div>
        </div>

        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="exercise.judgeGroup"></h3>
          <p class="modal-hint" id="exerciseJudge"></p>
        </div>

        <!-- 关键帧判据与判分：逐格数值由 src/specs.js 从识别器真正使用的常量里取 -->
        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="exercise.specGroup"></h3>
          <p class="modal-hint" data-i18n="exercise.specLead"></p>
          <div class="spec-box" id="exerciseSpecs"></div>
        </div>

        <div class="modal-group">
          <h3 class="modal-group-title" data-i18n="exercise.cameraGroup"></h3>
          <p class="modal-hint" id="exerciseCamera"></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
